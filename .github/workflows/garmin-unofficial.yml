name: Garmin unofficial import

# Runs scripts/garmin/import_unofficial.py: training readiness, training status (load, load
# focus), race predictions, VO2 max, FTP and the Garmin Coach plan, which Garmin's official
# Personal API doesn't serve. The rest
# of the import is the Vercel Cron job (app/api/garmin/cron). See scripts/garmin/README.md.
#
# The morning run then calls the app's morning job (app/api/summary/cron?after=import): today's
# sleep and recovery, and notes for new activities. Needs the repo secrets APP_URL (the
# production site, no trailing slash) and CRON_SECRET (the same value as on Vercel); without them
# Vercel's later fallback cron does it.
#
# The Garmin login session comes from the garmin_token_cache table, shared with local runs.

on:
  schedule:
    # Readiness is computed on waking and again after each workout. GitHub cron is UTC:
    # 15:30 UTC is 7:30 am PST / 8:30 am PDT (the morning score); 05:30 UTC is 9:30 pm PST /
    # 10:30 pm PDT (after the day's workouts).
    - cron: "30 15 * * *"
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      summaries:
        description: Write the morning AI summaries afterwards (spends Gemini calls)
        type: boolean
        default: false

concurrency:
  # Shared with garmin-push.yml: two runs refreshing the one Garmin session would log each other out.
  group: garmin-session
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/garmin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - run: python import_unofficial.py --yesterday
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Anything the web app queued while the push trigger wasn't set up (or failed) goes out here.
      - run: python push_workout.py --pending
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Runs even when the import failed: the summaries still have yesterday's rows to work from.
      # Only the HTTP status is printed; this repo's Actions logs are public.
      - name: Write the morning summaries
        if: always() && (github.event.schedule == '30 15 * * *' || inputs.summaries)
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET isn't set; Vercel's fallback cron writes the summaries later."
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 200 \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/summary/cron?after=import")
          echo "Summary job answered $status"
          test "$status" = 200
